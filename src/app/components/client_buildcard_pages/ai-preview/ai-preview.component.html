<div class="wrapper">

    <div class="sidebar">
      <button 
        *ngFor="let page of pages"
        class="page-btn"
        (click)="loadPage(page)">
        {{ page.pageName }}
      </button>
    </div>
  
    <div class="content">
      <div class="render-box" [innerHTML]="currentHtml"></div>
    </div>
  
  </div>
