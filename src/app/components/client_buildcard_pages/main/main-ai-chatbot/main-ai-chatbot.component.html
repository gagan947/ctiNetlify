<div class="main-ai-chat-shell container-fluid d-flex justify-content-center align-items-start">
  <div class="main-ai-chat-card w-100">
    <div #chatScroll class="main-ai-chat-scroll">
      @for(message of chatMessages; track $index){
      <div class="main-ai-thread-row" [class.is-user]="message.sender === 'user'" [class.is-ai]="message.sender === 'ai'">
        <div class="main-ai-thread-meta">{{ message.sender === 'user' ? 'You' : 'AI' }}</div>
        <p class="main-ai-thread-text" [class.main-ai-ai-message]="message.sender === 'ai'" [class.is-error]="message.variant === 'error'">
          {{ message.text }}
        </p>
      </div>
      }

      @if(isSubmitting && currentLoaderText){
      <div class="main-ai-thread-row is-ai">
        <div class="main-ai-thread-meta">AI</div>
        <div class="main-ai-thread-loader">
          <div class="main-ai-loader-copy">
            <span class="main-ai-loader-pill">Thinking</span>
            <strong>{{ currentLoaderText }}</strong>
            <div class="main-ai-typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </div>
      }

      @if(followUpLoaderText){
      <div class="main-ai-thread-row is-ai">
        <div class="main-ai-thread-meta">Builder</div>
        <div class="main-ai-followup-loader">
          <span>{{ followUpLoaderText }}</span>
          <div class="main-ai-typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
      }
    </div>

    <div class="main-ai-chat-composer">
      <div class="main-ai-composer main-ai-chat-composer-box">
        <textarea #chatPromptInput class="main-ai-prompt-input main-ai-chat-input" rows="2"
          placeholder="Reply with more requirement details..."
          [(ngModel)]="promptText"
          (keydown)="handlePromptKeydown($event)"></textarea>

        <div class="main-ai-composer-footer">
          <div class="main-ai-right-actions">
            <button type="button" class="main-ai-submit-btn" aria-label="Send message" [disabled]="isSubmitting" (click)="submitPrompt()">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
