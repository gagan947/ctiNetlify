<div class="main-ai-page-shell">
  <app-workspace-header></app-workspace-header>

  @if(!isChatMode){
  <div class="main-ai-wrap ct_lightblue_shape_new_12 position-relative" style="overflow: hidden;">
    <div class="main-ai-stage">
      <div class="align-self-end">
        <h1 class="main-ai-heading">What do you want to <span class="gradient-text ct_fw_700 ct_inter">build
            today?</span></h1>
        <p class="main-ai-subheading">Describe your idea and let AI turn it into a real product in seconds.</p>
      </div>
      <div class="position-relative " style="z-index: 1;">
        <!-- <img src="../../../../../assets/img/lightblue_shape_promp.png" alt="" class="ct_light_blue_shape_props"> -->

        <div class="main-ai-composer">
          <textarea #promptInput class="main-ai-prompt-input" rows="5" [attr.placeholder]="activePlaceholder"
            [(ngModel)]="promptText" (keydown)="handlePromptKeydown($event)"></textarea>

          <div class="main-ai-composer-footer">
            <div class="main-ai-left-actions">
              <button type="button" class="main-ai-chip-btn" aria-label="Attach files">
                <svg width="14" height="15" viewBox="0 0 14 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M1.00081e-06 7.46897C-0.000220456 7.59275 0.0363151 7.7138 0.104976 7.81679C0.173636 7.91978 0.27133 8.00006 0.385672 8.04745C0.500014 8.09485 0.625854 8.10723 0.747239 8.08302C0.868625 8.05881 0.980089 7.99911 1.0675 7.91147L6.81125 2.16522C7.39738 1.57909 8.19234 1.24981 9.02125 1.24981C9.43169 1.24981 9.8381 1.33065 10.2173 1.48772C10.5965 1.64479 10.941 1.875 11.2313 2.16522C11.5215 2.45544 11.7517 2.79999 11.9088 3.17918C12.0658 3.55837 12.1467 3.96479 12.1467 4.37522C12.1467 4.78566 12.0658 5.19207 11.9088 5.57127C11.7517 5.95046 11.5215 6.295 11.2313 6.58522L4.6025 13.214C4.36675 13.4417 4.051 13.5677 3.72325 13.5648C3.3955 13.562 3.08199 13.4305 2.85023 13.1987C2.61847 12.967 2.48701 12.6535 2.48416 12.3257C2.48131 11.998 2.6073 11.6822 2.835 11.4465L9.46375 4.81772C9.52186 4.75961 9.56796 4.69063 9.59941 4.6147C9.63085 4.53878 9.64704 4.4574 9.64704 4.37522C9.64704 4.29304 9.63085 4.21167 9.59941 4.13574C9.56796 4.05982 9.52186 3.99083 9.46375 3.93272C9.40564 3.87461 9.33666 3.82852 9.26073 3.79707C9.18481 3.76562 9.10343 3.74943 9.02125 3.74943C8.93907 3.74943 8.8577 3.76562 8.78177 3.79707C8.70585 3.82852 8.63686 3.87461 8.57875 3.93272L1.95 10.5627C1.71123 10.7933 1.52077 11.0692 1.38975 11.3742C1.25872 11.6792 1.18976 12.0073 1.18687 12.3392C1.18399 12.6712 1.24724 13.0004 1.37295 13.3076C1.49865 13.6148 1.68428 13.894 1.91901 14.1287C2.15375 14.3634 2.43287 14.5491 2.74012 14.6748C3.04736 14.8005 3.37656 14.8637 3.7085 14.8608C4.04045 14.858 4.3685 14.789 4.67351 14.658C4.97852 14.527 5.25438 14.3365 5.485 14.0977L12.1138 7.46897C12.9343 6.64846 13.3952 5.5356 13.3952 4.37522C13.3952 3.21484 12.9343 2.10199 12.1138 1.28147C11.2932 0.46096 10.1804 0 9.02 0C7.85962 0 6.74676 0.46096 5.92625 1.28147L0.183751 7.02647C0.125749 7.08462 0.079776 7.15363 0.0484614 7.22956C0.0171467 7.30549 -0.000145683 7.38684 1.00081e-06 7.46897Z"
                    fill="white" />
                </svg>

              </button>
              <button type="button" class="main-ai-chip-btn main-ai-voice-toggle-btn"
                [class.is-starting]="isVoiceStarting" [class.is-listening]="isVoiceUiVisible"
                [disabled]="isVoiceStarting || speechService.isListening"
                [attr.aria-label]="isVoiceUiVisible ? 'Voice input active' : isVoiceStarting ? 'Voice input is starting' : 'Start voice input'"
                (click)="startVoiceTyping()">
                <span class="main-ai-voice-toggle-icon">
                  <i class="fa-solid" [class.fa-microphone]="!speechService.isListening"
                    [class.fa-wave-square]="speechService.isListening"></i>
                </span>
                @if (isVoiceStarting) {
                <span class="main-ai-voice-loader" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                </span>
                }
                <span class="main-ai-voice-toggle-text">
                  {{ isVoiceUiVisible && !isVoiceStarting ? 'Listening' : '' }}
                </span>
              </button>
              @if (isVoiceDraftActive || isVoiceStarting) {
              <button type="button" class="main-ai-voice-action-btn is-cancel" aria-label="Discard voice text"
                (click)="cancelVoiceDraft()">
                <i class="fa-solid fa-xmark"></i>
              </button>
              <button type="button" class="main-ai-voice-action-btn is-apply" aria-label="Use voice text"
                [disabled]="isVoiceStarting || !voiceDraftText.trim()" (click)="applyVoiceDraft()">
                <i class="fa-solid fa-check"></i>
              </button>
              }

              <div *ngIf="isModelDropdownOpen" (click)="isModelDropdownOpen = false"
                class="position-fixed top-0 start-0 w-100 h-100" style="z-index: 999;"></div>

              <div class="position-relative me-2" style="z-index: 1000;">
                <button class="main-ai-chip-btn d-flex align-items-center justify-content-between gap-2 px-3 text-white"
                  type="button" style="width: max-content; font-size: 13px;"
                  (click)="isModelDropdownOpen = !isModelDropdownOpen">
                  {{ selectedAiModel === 'openai' ? 'OpenAI' : 'Claude' }}
                  <i class="fa-solid fa-chevron-up" style="font-size: 10px;" *ngIf="isModelDropdownOpen"></i>
                  <i class="fa-solid fa-chevron-down" style="font-size: 10px;" *ngIf="!isModelDropdownOpen"></i>
                </button>

                <div class="position-absolute rounded shadow-lg overflow-hidden py-1"
                  style="bottom: 100%; left: 0; margin-bottom: 8px; background-color: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); min-width: 120px;"
                  *ngIf="isModelDropdownOpen">
                  <a href="javascript:void(0)" class="d-block px-3 py-2 text-white text-decoration-none"
                    style="font-size: 13px;"
                    [style.background-color]="selectedAiModel === 'openai' ? 'rgba(255,255,255,0.1)' : 'transparent'"
                    (click)="selectedAiModel = 'openai'; isModelDropdownOpen = false;">OpenAI</a>
                  <a href="javascript:void(0)" class="d-block px-3 py-2 text-white text-decoration-none"
                    style="font-size: 13px;"
                    [style.background-color]="selectedAiModel === 'claude' ? 'rgba(255,255,255,0.1)' : 'transparent'"
                    (click)="selectedAiModel = 'claude'; isModelDropdownOpen = false;">Claude</a>
                </div>
              </div>
            </div>

            <div class="main-ai-right-actions">
              <button type="button" class="main-ai-submit-btn" aria-label="Continue" (click)="submitPrompt()">

                ↑

              </button>
            </div>
          </div>
        </div>

        <div class="eti_suggestions">
          @for (suggestion of SUGGESTIONS; track suggestion) {
          <div class="et_tag" (click)="usePromptIdea(suggestion.prompt)">{{ suggestion.label }}</div>
          }
        </div>
      </div>
    </div>
  </div>
  } @else {
  <app-main-ai-chatbot [initialPrompt]="submittedPrompt" [subsriptionPlan]="subscriptionPlan"></app-main-ai-chatbot>
  }
</div>
