<div class="main-ai-page-shell">
  <app-workspace-header></app-workspace-header>

  @if(!isChatMode){
  <div class="main-ai-wrap">
    <div class="main-ai-stage">
      <div class="align-self-end">
        <h1 class="main-ai-heading">What do you want to build today?</h1>
        <p class="main-ai-subheading">Describe your idea and let AI turn it into a real product in seconds.</p>
      </div>
      <div class="main-ai-composer">
        <textarea #promptInput class="main-ai-prompt-input" rows="5" [attr.placeholder]="activePlaceholder"
          [(ngModel)]="promptText" (keydown)="handlePromptKeydown($event)"></textarea>

        <div class="main-ai-composer-footer">
          <div class="main-ai-left-actions">
            <button type="button" class="main-ai-chip-btn" aria-label="Attach files">
              <i class="fa-solid fa-paperclip"></i>
            </button>
            <button
              type="button"
              class="main-ai-chip-btn main-ai-voice-toggle-btn"
              [class.is-listening]="isVoiceUiVisible"
              [disabled]="isVoiceDraftActive"
              [attr.aria-label]="isVoiceUiVisible ? 'Voice input active' : 'Start voice input'"
              (click)="startVoiceTyping()">
              <span class="main-ai-voice-toggle-icon">
                <i
                  class="fa-solid"
                  [class.fa-microphone]="!isVoiceUiVisible"
                  [class.fa-wave-square]="isVoiceUiVisible"></i>
              </span>
              <span class="main-ai-voice-toggle-text">
                {{ isVoiceUiVisible ? 'Listening' : '' }}
              </span>
            </button>
            @if (isVoiceUiVisible) {
            <button
              type="button"
              class="main-ai-voice-action-btn is-cancel"
              aria-label="Discard voice text"
              (click)="cancelVoiceDraft()">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <button
              type="button"
              class="main-ai-voice-action-btn is-apply"
              aria-label="Use voice text"
              [disabled]="!voiceDraftText.trim()"
              (click)="applyVoiceDraft()">
              <i class="fa-solid fa-check"></i>
            </button>
            }
          </div>

          <div class="main-ai-right-actions">
            <button type="button" class="main-ai-submit-btn" aria-label="Continue" (click)="submitPrompt()">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  } @else {
  <app-main-ai-chatbot [initialPrompt]="submittedPrompt" [subsriptionPlan]="subscriptionPlan"></app-main-ai-chatbot>
  }
</div>
