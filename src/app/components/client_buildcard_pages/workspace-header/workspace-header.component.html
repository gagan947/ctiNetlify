<div class="main-ai-topbar" role="banner">
    <div class="main-ai-topbar__left">
        <a class="main-ai-topbar__home" routerLink="/main">
            <i class="fa-solid fa-table-cells-large"></i>
            <span>Home</span>
        </a>

        @for (project of allProjectsList; track project.inquiryId) {
        <button type="button" class="main-ai-topbar__tab"
            [class.main-ai-topbar__tab--active]="project.inquiryId === selectedProjectId"
            (click)="selectProjectTab(project)">
            <!-- @if(project.inquiryId === selectedProjectId) { -->
            <span class="main-ai-topbar__tab-dot-wrap">
                <span class="main-ai-topbar__tab-dot"></span>
            </span>
            <!-- } -->
            <span class="main-ai-topbar__tab-label">{{ project.projectName }}</span>
            <span class="main-ai-topbar__tab-close" aria-hidden="true">
                <i class="fa-solid fa-xmark"></i>
            </span>
        </button>
        }

        <button type="button" class="main-ai-topbar__add" aria-label="Add tab">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <div class="main-ai-topbar__right" style="padding-bottom: 6px;">
        <button type="button" class="main-ai-topbar__credits" (click)="openSubscriptionModal()">Upgrade</button>

        <div class="main-ai-topbar__utility-group" #profileMenu>
            <!-- <button type="button" class="main-ai-topbar__icon" aria-label="Notifications">
          <i class="fa-solid fa-bell"></i>
        </button>
        <button type="button" class="main-ai-topbar__icon" aria-label="Workspace">
          <i class="fa-solid fa-gift"></i>
        </button> -->
            <button type="button" class="main-ai-topbar__avatar" aria-label="Open profile menu"
                [class.main-ai-topbar__avatar--active]="isProfileMenuOpen" (click)="toggleProfileMenu($event)">
                @if (profileImageUrl) {
                <img [src]="profileImageUrl" [alt]="userName">
                } @else {
                {{ avatarInitial }}
                }
            </button>

            @if (isProfileMenuOpen) {
            <div class="main-ai-profile-menu">
                <div class="main-ai-profile-menu__email">{{ userEmail }}</div>

                <div class="main-ai-profile-menu__workspace">
                    <div class="main-ai-profile-menu__workspace-left">
                        <div class="main-ai-profile-menu__workspace-avatar">
                            @if (profileImageUrl) {
                            <img [src]="profileImageUrl" [alt]="userName">
                            } @else {
                            <span>{{ avatarInitial }}</span>
                            }
                        </div>
                        <div>
                            <h4 class="text-white ct_fs_14">{{ companyName }}</h4>
                            <p>{{ userEmail }}</p>
                        </div>
                    </div>
                    <!-- <button type="button" class="main-ai-profile-menu__swap" aria-label="Switch workspace">
                        <i class="fa-solid fa-right-left"></i>
                    </button> -->
                </div>

                <div class="main-ai-profile-menu__credits-card">
                    <!-- <div class="main-ai-profile-menu__credits-row">
              <span>Credits <i class="fa-regular fa-circle-question"></i></span>
              <strong><i class="fa-solid fa-circle-chevron-right"></i> -1.40</strong>
            </div> -->
                    <button type="button" class="main-ai-profile-menu__upgrade"
                        (click)="openSubscriptionModal()">Upgrade
                        <span>✦</span></button>
                </div>

                <div class="main-ai-profile-menu__actions">
                    <button type="button" class="main-ai-profile-menu__action" routerLink="/dashboard">
                        <i class="fa-regular fa-building"></i>
                        <span class="ct_fs_14">Account Projects</span>
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </button>
                    <button type="button" class="main-ai-profile-menu__action" routerLink="/my-plan">
                        <i class="fa-solid fa-globe"></i>
                        <span class="ct_fs_14">My Plans</span>
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </button>
                    <!-- <button type="button" class="main-ai-profile-menu__action">
              <i class="fa-brands fa-github"></i>
              <span>Connect to Github</span>
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </button> -->
                    <!-- <button type="button" class="main-ai-profile-menu__action">
              <i class="fa-brands fa-discord"></i>
              <span>Community</span>
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </button> -->
                    <button type="button" class="main-ai-profile-menu__action" routerLink="/profile">
                        <i class="fa-regular fa-user"></i>
                        <span class="ct_fs_14">My Profile</span>
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </button>
                </div>

                <div class="main-ai-profile-menu__footer">
                    <button type="button" class="main-ai-profile-menu__logout" (click)="LogOut()">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span class="ct_fs_14">Logout</span>
                    </button>
                </div>
            </div>
            }
        </div>
    </div>
</div>

<app-subcription-page [subscriptionModalOpen]="subscriptionModalOpen"
    [selectedTemplateId]="selectedSubscriptionTemplateId" (close)="closeSubscriptionModal()">
</app-subcription-page>
