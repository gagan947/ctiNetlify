


<div class="row">
    <div class="col-xxl-8 col-xl-9 col-lg-9 mx-auto">
        <div class="px-3 px-md-4" style=" background-color: #fff9f99e;
    padding-block: 30px;
    border-radius: 10px;
    position: relative;">
            <div #scrollContainer class="ct_creative_msg_top_bar px-3">
                <h4 class="ct_fs_28 ct_fw_600 mb-0">Hello, <span class="ct_gradient_clr ct_fw_600" style="text-transform: capitalize;">{{userName}}</span>
                </h4>
                <p class="ct_fs_28 ct_text_op_06 ct_fw_600 mb-4">How can I help you today?</p>
                <div class="row">
                    <div class="col-md-12 mx-auto px-md-4">
                        <div class="ct_grid_6_new">
                            @for (item of basicOptions; track $index) {
                            <div class="ct_key_point_box" (click)="selectOption(item)">
                                <p class="mb-0"><img [src]="item.logo" alt=""></p>
                                <p class="mb-0 ct_fs_16 ct_fw_600"> {{item.label}} </p>
                            </div>
                            }
                        </div>

                    </div>

                </div>
                @for (item of messages; track $index) {

                <div class="d-flex align-items-center gap-2 mb-3" class="msg-row"
                    [ngClass]="item.sender === 'You' ? 'out' : 'in'">
                    @if(item.sender === 'You') {
                    <img [src]='profileImage' alt="AI app builder for mobile and web" class="avatar" />
                    } @else {
                    <img src="assets/img/c.png" alt="AI app builder for mobile and web" class="p-1 avatar abc" />
                    }
                    <div class="ct_creative_msg_card cti_msg_left mb-0">
                        <p class="mb-0" style="white-space: pre-wrap;   font-size: 14px;">{{ item.text }}</p>
                        <small class="ct_chat_time_local">{{item.time | date:'shortTime'}}</small>

                    </div>
                </div>
                }

             

                <div *ngIf="isLoading" class="msg-row in">
                    <!-- <div class="spinner-grow" role="status">
                        <span class="sr-only">Loading...</span>
                    </div> -->
                    <div class="loader-gradient-wave" [attr.data-text]="loadingText">{{ loadingText }}</div>
                </div>


            </div>
            <footer class="chat-input">
                <!-- <input [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Type your message…"
                    autocomplete="off" /> -->
                <textarea [autosize]="true" [rows]="1" [maxRows]="6" [(ngModel)]="userMessage" [disabled]="isLoading"
                    (keyup.enter)="sendMessage()" class="form-control ct_input" placeholder="Type your message…"
                    [onlyGrow]="false" style="height: 45px !important;"></textarea>

                <button (click)="sendMessage()" aria-label="Send message">
                    ➤
                </button>
            </footer>
        </div>
    </div>
</div>
